; SnapDeck settings - copy to SnapDeck.ini next to SnapDeck.ahk
; (SnapDeck creates SnapDeck.ini with these defaults on first run)

[Settings]
; Folder ShareX saves screenshots to (subfolders are scanned too)
ShareXFolder=C:\Users\<you>\Documents\ShareX\Screenshots

; Where session folders and outputs are created
OutputFolder=C:\Users\<you>\Documents\SnapDeck

; Move = take screenshots out of the ShareX folder, Copy = leave originals there
Mode=Move

; Stop automatically after this many minutes (0 = never)
AutoStopMinutes=60

; Formats built when auto-stopping: any of pptx,pdf,docx,zip
AutoStopFormats=pptx

; Optional PowerPoint template (.potx or .pptx). Empty = plain 16:9 slides.
; SnapDeck uses its "Title Slide", "Blank" and "Closing" layouts and its logo.
Template=

; 1 = time + app caption on each slide/page
Captions=1

; 1 = show the on-screen REC badge while recording
ShowBadge=1

; 1 = open the notes panel when a session starts
NotesPanel=1

; 1 = show notes as the slide heading, 0 = speaker notes only
NotesOnSlide=1
